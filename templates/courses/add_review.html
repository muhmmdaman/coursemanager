{% extends 'base.html' %}
{% block title %}Review Course{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <h2>Review {{ course.title }}</h2>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary btn-lg w-100">Post Review</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
