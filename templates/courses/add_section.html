{% extends 'base.html' %}
{% block title %}Add Section - {{ course.title }}{% endblock %}
{% block content %}
<div class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Add New Section</h3>
                    </div>
                    <div class="card-body">
                        <p class="text-muted mb-4">Adding section to: <strong>{{ course.title }}</strong></p>
                        <form method="POST">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Create Section</button>
                                <a href="{% url 'course_detail' course.id %}" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
